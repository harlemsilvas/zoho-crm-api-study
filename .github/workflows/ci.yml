name: CI

on:
  push:
    branches: [feat/structured-logs, main]
  pull_request:
    branches: [feat/structured-logs, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate workflow contract
        run: npm run validate:workflow

      - name: Check whitespace
        run: git diff --check
